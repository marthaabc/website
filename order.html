<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Rulindo Agro Marketing - Order System</title>

<style>
body{
  margin:0;
  font-family: Arial, sans-serif;
  background:#f2f2f2;
}

/* HEADER */
header{
  text-align:center;
  background:linear-gradient(to right, green, #00c853);
  color:white;
  padding:20px;
}

.logo img{
  width:80px;
}

.brand-name{
  font-size:18px;
  font-weight:bold;
}

/* NAVIGATION */
nav{
  background:#0b5d1e;
  padding:10px;
}

nav ul{
  list-style:none;
  display:flex;
  justify-content:center;
  gap:20px;
  padding:0;
  margin:0;
}

nav ul li a{
  color:white;
  text-decoration:none;
  font-weight:bold;
}

nav ul li a:hover{
  color:yellow;
}

/* ORDER FORM */
.order-box{
  width:400px;
  margin:30px auto;
  background:white;
  padding:20px;
  border-radius:10px;
  box-shadow:0 0 10px rgba(0,0,0,0.2);
}

label{
  display:block;
  margin-top:10px;
}

input, select{
  width:100%;
  padding:8px;
  margin-top:5px;
}

button{
  width:100%;
  margin-top:15px;
  padding:10px;
  background:green;
  color:white;
  border:none;
  cursor:pointer;
  font-size:16px;
}

button:hover{
  background:darkgreen;
}

#message{
  margin-top:10px;
  color:green;
  font-weight:bold;
}
</style>

</head>

<body>

<!-- HEADER -->
<header>
    <div class="logo">
        <a href="vava.html">
            <img src="fofo.png" alt="Logo">
        </a>
    </div>

    <div class="brand-name">RW-RULINDO AGRO MARKETING</div>

    <h1>WELCOME TO AGRO MARKETING</h1>
    <p>Your best place for farming business</p>
</header>

<!-- NAVIGATION -->
<nav>
    <ul>
        <li><a href="vava.html">Home</a></li>
        <li><a href="shop.html">Shop</a></li>
        <li><a href="cart.html">Cart</a></li>
        <li><a href="orders.html">Orders</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="contact.html">Contact</a></li>
        <li><a href="help.html">Help</a></li>
    </ul>
</nav>

<!-- ORDER FORM -->
<section class="order-box">

  <h2>Place Your Order</h2>

  <form id="orderForm">

    <label>Full Name</label>
    <input type="text" id="name" required>

    <label>Phone Number</label>
    <input type="tel" id="phone" required>

    <label>Product</label>
    <select id="product">
      <option>Maize</option>
      <option>Beans</option>
      <option>Rice</option>
      <option>Potatoes</option>
    </select>

    <label>Quantity (kg)</label>
    <input type="number" id="quantity" required>

    <label>Location</label>
    <input type="text" id="location" required>

    <button type="submit">Place Order</button>

  </form>

  <div id="message"></div>

</section>

<script>
document.getElementById("orderForm").addEventListener("submit", function(e){
  e.preventDefault();

  let name = document.getElementById("name").value;
  let product = document.getElementById("product").value;
  let quantity = document.getElementById("quantity").value;

  document.getElementById("message").innerHTML =
    "Thank you " + name + "! Your order of " + quantity + "kg of " + product + " has been successfully received.";

  localStorage.setItem("lastOrder", name + " ordered " + product + " (" + quantity + "kg)");
});
</script>

</body>
</html>
